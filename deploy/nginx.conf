# Per IP, loose on purpose: demo audiences share one Wi-Fi exit IP. The api limits per phone / email itself.
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/conf.d/security_headers.inc;

    # Proxy through a variable so nginx starts (and keeps serving the site) even while the api container is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://aiditto-api:8080;

    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass $api_upstream;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location /api/photos/blob/ {
        client_max_body_size 10m;
        proxy_request_buffering on;
        proxy_pass $api_upstream;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location /api/ {
        client_max_body_size 1m;
        proxy_read_timeout 60s;
        proxy_pass $api_upstream;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # Only reachable through the api's X-Accel-Redirect after it has checked who may see the photo.
    # Cache-Control comes from the api response.
    location /_photos/ {
        internal;
        alias /srv/photos/;
        include /etc/nginx/conf.d/security_headers.inc;
    }

    location /assets/ {
        expires 30d;
        include /etc/nginx/conf.d/security_headers.inc;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        include /etc/nginx/conf.d/security_headers.inc;
        add_header Cache-Control "no-cache";
    }
}
